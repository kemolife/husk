name: Example Pipeline

jobs:
  build:
    image: alpine:3.19
    script: echo "Build complete — $(date)"

  unit-test:
    needs: build
    image: alpine:3.19
    script: |
      echo "Running tests..."
      sleep 1
      echo "All tests passed"

  lint:
    needs: build
    image: alpine:3.19
    script: echo "Lint OK"

  docker-build:
    needs: [unit-test, lint]
    image: alpine:3.19
    script: echo "Image built: myapp:latest"

  deploy-staging:
    needs: docker-build
    if: environment == staging
    image: alpine:3.19
    script: echo "Deployed to staging"

  approve-prod:
    needs: deploy-staging
    type: approval

  deploy-prod:
    needs: approve-prod
    if: environment == production
    image: alpine:3.19
    script: echo "Deployed to production"
