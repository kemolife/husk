x-app-env: &app-env
  APP_ENV: dev
  APP_SECRET: devsecret
  DATABASE_URL: postgresql://app:app@db:5432/pipeline
  MESSENGER_TRANSPORT_DSN: amqp://app:app@rabbitmq:5672/%2f/messages

x-app-depends: &app-depends
  db:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

services:
  app:
    build: .
    ports:
      - "8080:9000"
    environment:
      <<: *app-env
    volumes:
      - .:/var/www/app
    depends_on:
      <<: *app-depends

  worker:
    build: .
    command: php bin/console messenger:consume async --time-limit=3600 -vv
    environment:
      <<: *app-env
    volumes:
      - .:/var/www/app
    depends_on:
      <<: *app-depends

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pipeline
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d pipeline"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/postgresql/data:rw
###< doctrine/doctrine-bundle ###

volumes:
  db_data:

###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
