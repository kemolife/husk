x-app-env: &app-env
  APP_ENV: dev
  APP_SECRET: devsecret
  DATABASE_URL: postgresql://app:app@db:5432/pipeline
  MESSENGER_TRANSPORT_DSN: amqp://app:app@rabbitmq:5672/%2f/messages
  CORS_ALLOW_ORIGIN: '^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$'

x-app-depends: &app-depends
  db:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      <<: *app-env
    volumes:
      - .:/var/www/app
    depends_on:
      <<: *app-depends

  worker:
    build: .
    command: php bin/console messenger:consume async --time-limit=3600 -vv
    user: root
    environment:
      <<: *app-env
    volumes:
      - .:/var/www/app
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      <<: *app-depends
    deploy:
      replicas: 4

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pipeline
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d pipeline"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
