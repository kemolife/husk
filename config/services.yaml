parameters:
    pipelines_dir: '%kernel.project_dir%/pipelines'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Domain/'
            - '../src/Kernel.php'

    # Port bindings
    App\Infrastructure\Persistence\Yaml\YamlFilePipelineRepository:
        arguments:
            $pipelinesDir: '%pipelines_dir%'

    App\Application\Port\PipelineRepositoryPort:
        alias: App\Infrastructure\Persistence\Yaml\YamlFilePipelineRepository

    App\Application\Port\PipelineRunRepositoryPort:
        class: App\Infrastructure\Persistence\Doctrine\DoctrinePipelineRunRepository

    App\Application\Port\SecretRepositoryPort:
        class: App\Infrastructure\Secrets\EnvSecretAdapter

    App\Application\Port\ExecutorPort:
        class: App\Infrastructure\Executor\DockerSocketExecutorAdapter
        arguments:
            $socketPath: '/var/run/docker.sock'

    App\Infrastructure\Http\Controller\ListPipelinesController:
        arguments:
            $pipelinesDir: '%pipelines_dir%'

    App\Application\Port\PipelineEventRepositoryPort:
        class: App\Infrastructure\Persistence\Doctrine\DoctrinePipelineEventRepository

    App\Application\Port\ApprovalRecordRepositoryPort:
        class: App\Infrastructure\Persistence\Doctrine\DoctrineApprovalRecordRepository

    App\Application\Port\NotificationPort:
        class: App\Infrastructure\Notification\CompositeNotificationAdapter

    App\Infrastructure\Http\Controller\GithubWebhookController:
        arguments:
            $webhookSecret: '%env(GITHUB_WEBHOOK_SECRET)%'

    App\Infrastructure\Http\EventListener\ApiKeyListener:
        arguments:
            $apiKeyRequired: '%env(bool:API_KEY_REQUIRED)%'
