framework:
    messenger:
        failure_transport: failed

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
            failed:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queues:
                        failed: ~

        routing:
            # TriggerPipeline runs synchronously in the HTTP process — creates the PipelineRun
            # record immediately so GET /pipeline-runs/{id} works right after the 202 response.
            # Only job execution is async.
            App\Application\Command\ExecuteJob\ExecuteJobCommand: async
            App\Application\Command\ApprovePipelineJob\ApprovePipelineJobCommand: async
